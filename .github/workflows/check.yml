name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leak check
        run: python tools/leak_check.py
      - name: JSON manifests parse
        run: |
          python -c "import json,glob; [json.load(open(p, encoding='utf-8')) for p in glob.glob('**/*.json', recursive=True)]; print('ok')"
      - name: Python scripts compile
        run: python -m compileall -q plugins tools
